# Ruff configuration

exclude = [
    ".venv",
    ".agent",
    "node_modules",
]

[lint]
ignore = [
    "E712", # Avoid equality comparisons to True
    "E402", # Module level import not at top of file
    "F811", # Redefinition of unused function
    "F821", # Undefined name
    "E701", # Multiple statements on one line
    "F401", # Unused import
]
